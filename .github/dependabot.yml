version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - Mostafa-SAID7
    allow:
      - dependency-type: all
    # Block automatic major upgrades that break the Angular 18 + TS 5.4 stack.
    # Schedule those as dedicated migration PRs instead of Dependabot batches.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - "minor"
          - "patch"
      commitlint:
        patterns:
          - "@commitlint/*"
          - "commitlint"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "angular-eslint"
          - "@angular-eslint/*"
        update-types:
          - "minor"
          - "patch"
      build-tooling:
        patterns:
          - "vite"
          - "rollup"
          - "@rollup/*"
          - "webpack"
          - "esbuild"
      types:
        patterns:
          - "@types/*"
      testing:
        patterns:
          - "jasmine*"
          - "karma*"
          - "jest"
      remaining:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@commitlint/*"
          - "commitlint"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "angular-eslint"
          - "@angular-eslint/*"
          - "vite"
          - "rollup"
          - "@rollup/*"
          - "webpack"
          - "esbuild"
          - "@types/*"
          - "jasmine*"
          - "karma*"
          - "jest"
